services:
  - type: web
    name: e-peperiksaan-kislb-demo
    rootDir: e-peperiksaan-kislb-demo-online-render
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 wsgi:app
    envVars:
      - key: DEMO_SECRET_KEY
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_GURU_PASSWORD
        sync: false
      - key: DEMO_IBU_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
