services:
  - type: web
    name: e-peperiksaan-kislb-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 wsgi:app
    envVars:
      - key: DEMO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.11
