{% extends "base.html" %}{% block content %}<div class="split-title"><div><h1>Pengurusan Guru</h1><p class="muted">Cipta akaun guru dan urus akses key-in markah.</p></div><a class="button secondary" href="{{url_for('assignments')}}">Tugasan Guru</a></div>
<div class="panel"><h2>Tambah Akaun Guru</h2><form method="post" class="grid-form"><label>Nama penuh<input name="full_name" required></label><label>Nama pengguna<input name="username" required></label><label>Kata laluan awal<input name="password" value="guru123" required></label><button>Tambah Guru</button></form></div>
<div class="panel"><table><thead><tr><th>Nama Guru</th><th>Username</th><th>Tugasan</th><th>Reset Kata Laluan</th></tr></thead><tbody>{% for t in teachers %}<tr><td><b>{{t.full_name}}</b></td><td>{{t.username}}</td><td>{{t.assignment_count}}</td><td><form method="post" action="{{url_for('reset_teacher_password',tid=t.id)}}" class="inline"><input name="password" placeholder="Min. 6 aksara" required><button>Reset</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
